[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesa"
version = "0.1.0"
description = "Detección explicable de riesgos de conflicto de interés en compras públicas del Paraguay"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Steven Gracia" }]
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
